name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run install:host
      - run: npm run check:host
      - run: git diff --exit-code -- package.json package-lock.json openclaw.plugin.json
      - name: Prepare review artifacts
        if: matrix.node == '24'
        run: |
          mkdir -p artifacts
          git archive --format=tar.gz --output=artifacts/source.tar.gz HEAD
          npm pack --ignore-scripts --pack-destination artifacts
          (cd artifacts && sha256sum *.tgz source.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node == '24'
        with:
          name: vk-workspace-review-${{ github.sha }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
