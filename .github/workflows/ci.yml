name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run install:host
      - run: npm run check:host
      - run: git diff --exit-code -- package.json package-lock.json openclaw.plugin.json
      - name: Prepare review artifacts
        if: matrix.node == '24'
        run: |
          mkdir -p artifacts
          git archive --format=tar.gz --output=artifacts/source.tar.gz HEAD
          npm pack --ignore-scripts --pack-destination artifacts
          (cd artifacts && sha256sum *.tgz source.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.node == '24'
        with:
          name: vk-workspace-review-${{ github.sha }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
